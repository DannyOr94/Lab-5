<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNA Chat</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; font: 15px system-ui, sans-serif; color: #172033; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; padding: .8rem 1rem; background: #17365d; color: #fff; }
      header a { color: #fff; }
      form { display: flex; gap: .5rem; padding: .6rem; position: fixed; bottom: 0; width: 100%; background: #101820; }
      form input { min-width: 0; border: 0; border-radius: 6px; padding: .75rem; }
      #nombre { width: 20%; }
      #m { flex: 1; }
      form button { border: 0; border-radius: 6px; padding: .7rem 1rem; background: #82e0ff; cursor: pointer; }
      #messages { list-style: none; margin: 0; padding: 0 0 4.5rem; }
      #messages li { padding: .45rem .7rem; overflow-wrap: anywhere; }
      #messages li:nth-child(odd) { background: #f1f5f9; }
      #chat-status { padding: .5rem 1rem; color: #475569; }
      @media (max-width: 600px) { #nombre { width: 32%; } }
    </style>
  </head>
  <body>
    <header>
      <strong>UNA Chat</strong>
      <span id="auth-user" aria-live="polite"></span>
      <a id="logout" href="/auth/logout" hidden>Cerrar sesión</a>
    </header>
    <div id="chat-status" role="status"></div>
    <ul id="messages" aria-live="polite"></ul>
    <form id="chat-form">
      <input id="nombre" autocomplete="off" placeholder="Nombre" aria-label="Nombre">
      <input id="m" autocomplete="off" placeholder="Escriba un mensaje" aria-label="Mensaje" required>
      <button type="submit">Enviar</button>
    </form>
    <script src="/socket.io/socket.io.js"></script>
    <script>
      (async function () {
        const nameInput = document.getElementById('nombre');
        const authUser = document.getElementById('auth-user');
        const logout = document.getElementById('logout');
        const status = document.getElementById('chat-status');
        const messages = document.getElementById('messages');
        const form = document.getElementById('chat-form');
        const messageInput = document.getElementById('m');

        try {
          const response = await fetch('/auth/me', { credentials: 'same-origin' });
          const result = await response.json();
          if (result.user) {
            nameInput.value = result.user.name;
            nameInput.readOnly = true;
            authUser.textContent = 'Sesión: ' + result.user.name;
            logout.hidden = false;
          }
        } catch (_) {
          status.textContent = 'No se pudo comprobar la sesión.';
        }

        const socket = io();
        socket.on('connect', function () {
          status.textContent = '';
        });
        socket.on('connect_error', function () {
          status.textContent = 'No se pudo conectar al chat. Inicia sesión de nuevo.';
        });
        socket.on('Evento-Mensaje-Server', function (raw) {
          try {
            const item = typeof raw === 'string' ? JSON.parse(raw) : raw;
            const row = document.createElement('li');
            const name = document.createElement('strong');
            name.textContent = String(item.nombre || 'Anónimo');
            if (/^#[0-9a-f]{6}$/i.test(String(item.color || ''))) {
              name.style.color = item.color;
            }
            row.appendChild(name);
            row.appendChild(document.createTextNode(': '));
            const parsed = new DOMParser().parseFromString(String(item.mensaje || ''), 'text/html');
            const candidate = parsed.body.firstElementChild;
            let media = null;
            if (candidate && parsed.body.children.length === 1 && ['IMG', 'VIDEO', 'IFRAME'].includes(candidate.tagName)) {
              try {
                const source = new URL(candidate.getAttribute('src'));
                const allowed = ['http:', 'https:'].includes(source.protocol) && !source.username && !source.password;
                const youtube = source.origin === 'https://www.youtube.com' && /^\/embed\/[\w-]{11}$/.test(source.pathname);
                if (allowed && (candidate.tagName !== 'IFRAME' || youtube)) {
                  media = document.createElement(candidate.tagName.toLowerCase());
                  media.src = source.href;
                  media.style.maxWidth = '100%';
                  media.style.maxHeight = '400px';
                  if (candidate.tagName === 'IMG') media.alt = 'Imagen compartida';
                  if (candidate.tagName === 'VIDEO') { media.controls = true; media.preload = 'metadata'; }
                  if (candidate.tagName === 'IFRAME') { media.title = 'Video de YouTube'; media.width = '560'; media.height = '315'; }
                }
              } catch (_) { /* Invalid sources are displayed as text. */ }
            }
            row.appendChild(media || document.createTextNode(parsed.body.textContent));
            messages.appendChild(row);
            window.scrollTo(0, document.body.scrollHeight);
          } catch (_) {
            status.textContent = 'Se recibió un mensaje con formato inválido.';
          }
        });

        form.addEventListener('submit', function (event) {
          event.preventDefault();
          const message = messageInput.value.trim();
          if (!message) return;
          socket.emit('Evento-Mensaje-Server', JSON.stringify({
            nombre: nameInput.value || 'Anónimo',
            mensaje: message,
            color: '#17365D'
          }));
          messageInput.value = '';
          messageInput.focus();
        });
      }());
    </script>
  </body>
</html>
